name: ci

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1

on:
  push:
    paths:
      - "**.c"
      - "**.cpp"
      - "**.f90"
      - "**/CMakeLists.txt"
      - "**.cmake"
      - ".github/workflows/ci.yml"


jobs:

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      matrix:
        c: [
          {cc: gcc-12, cxx: g++-12, fc: gfortran-12},
          {cc: gcc-13, cxx: g++-13, fc: gfortran-13},
          {cc: gcc-14, cxx: g++-14, fc: gfortran-14},
          {cc: clang-18, cxx: clang++-18, fc: gfortran},
          ]

    env:
      CC: ${{ matrix.c.cc }}
      CXX: ${{ matrix.c.cxx }}
      FC: ${{ matrix.c.fc }}

    steps:
    - uses: actions/checkout@v4

    - run: cmake --workflow default


  mac:
    runs-on: macos-latest
    timeout-minutes: 10

    strategy:
      matrix:
        c: [
          {cc: gcc-14, cxx: g++-14, fc: gfortran-14},
          {cc: clang, cxx: clang++, fc: gfortran-14}
          ]

    env:
      CC: ${{ matrix.c.cc }}
      CXX: ${{ matrix.c.cxx }}
      FC: ${{ matrix.c.fc }}

    steps:
    - uses: actions/checkout@v4

    - run: cmake --workflow default

  windows:
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      CMAKE_GENERATOR: "MinGW Makefiles"

    steps:
    - uses: msys2/setup-msys2@v2
      id: msys2
      with:
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc-fortran

    - name: Put MSYS2_MinGW64 on PATH
      run: echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - uses: actions/checkout@v4

    - run: cmake --workflow default
